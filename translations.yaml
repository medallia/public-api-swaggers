      summary: List translation exports
      tags:
        - Translations
        - Translation Exports
      description: Retrieves all translation export objects
      operationId: adminV0TranslationExportsGet
      parameters:
        - name: limit
          in: query
          description: The maximum number of translation exports to retrieve
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: The number of translation exports to skip before starting to collect the result set
          required: false
          schema:
            type: integer 
            format: int32
            default: 0
            minimum: 0
        - name: expand
          in: query
          description: Comma-separated list of related entities to include in the response
          required: false
          schema:
            type: string
      responses:
        200:
          description: A list of translation exports
          headers:
            X-RateLimit-Limit-day:
              $ref: '#/components/headers/X-RateLimit-Limit-day'
            X-RateLimit-Remaining-day:
              $ref: '#/components/headers/X-RateLimit-Remaining-day'
            X-RateLimit-Limit-second:
              $ref: '#/components/headers/X-RateLimit-Limit-second'
            X-RateLimit-Remaining-second:
              $ref: '#/components/headers/X-RateLimit-Remaining-second'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Medallia-Rpc-Request-Id:
              $ref: '#/components/headers/X-Medallia-Rpc-Request-Id'
