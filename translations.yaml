components:
  headers:
    X-RateLimit-Limit-day:
      description: The number of requests allowed in total in a 24-hour period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Limit.
      schema:
        type: integer
      example: 10000
      deprecated: true
    X-RateLimit-Remaining-day:
      description: The number of requests available to make in a 24-hour period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Remaining.
      schema:
        type: integer
      example: 10000
      deprecated: true
    X-RateLimit-Limit-second:
      description: The number of requests allowed in total in a 1-second period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Limit.
      schema:
        type: integer
      example: 10
      deprecated: true
    X-RateLimit-Remaining-second:
      description: The number of requests available to make in a 1-second period. Deprecated as of Sept. 2022 in favor of X-RateLimit-Remaining.
      schema:
        type: integer
      example: 10
      deprecated: true
    X-RateLimit-Limit:
      description:
        Indicates the request quota closest to reaching its limit
        amongst all available quotas. Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: string
      example: 10, 10;w=1, 100;w=86400
    X-RateLimit-Remaining:
      description:
        Indicates the number of requests remaining in the quota that is
        closest to expiring (as indicated by `X-RateLimit-Limit`).
        Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
    X-RateLimit-Reset:
      description:
        Indicates the number of seconds remaining until the quota
        resets.  Follows the semantics of
        [IETF draft-polli-ratelimit-headers](https://datatracker.ietf.org/doc/html/draft-polli-ratelimit-headers).
      schema:
        type: integer
      example: 10
    X-Medallia-Rpc-Request-Id:
      description: The request ID, used by Medallia support for troubleshooting
      schema:
        type: string
        format: identifier
      example: 94615edd-d9d0-4921-8b3e-60615b3d3431
  schemas:
    TranslationExportList:
      type: object
      description: Collection of translation export objects
      properties:
        items:
          type: array
          description: The list of translation exports
          items:
            $ref: '#/components/schemas/TranslationExport'
        _total:
          type: integer
          format: int32
          description: Total number of translation exports available
        _links:
          type: object
          description: Navigation links for pagination
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            next:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            prev:
              type: object
              properties:
                href:
                  type: string
                  format: uri
    TranslationExport:
      type: object
      description: A translation export object for exporting translations
      properties:
        id:
          type: string
          description: Translation export identifier
          readOnly: true
        name:
          type: string
          description: Name of the translation export
          maxLength: 10240
        description:
          type: string
          description: Description of the translation export
          maxLength: 10240
        status:
          type: string
          description: Status of the translation export
          enum:
            - pending
            - running
            - completed
            - failed
          readOnly: true
        file_format:
          type: string
          description: Format of the generated file
          enum:
            - excel
            - csv
          default: excel
        translation_tag_ids:
          type: array
          description: Translation tags for which this translation export is restricted to
          items:
            type: string
        translation_locale_ids:
          type: array
          description: Translation locales for which this translation export is restricted to
          items:
            type: string
        translation_statuses:
          type: array
          description: Translation statuses for which this translation export is restricted to
          items:
            type: string
            enum:
              - pending
              - accepted
              - changed
              - inherited
              - issue
              - default_translation_available
              - do_not_translate
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
        _links:
          type: object
          description: Related links for the translation export
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            file:
              type: object
              properties:
                href:
                  type: string
                  format: uri
              description: Link to download the exported file
    TranslationImportList:
      type: object
      description: Collection of translation import objects
      properties:
        items:
          type: array
          description: The list of translation imports
          items:
            $ref: '#/components/schemas/TranslationImport'
        _total:
          type: integer
          format: int32
          description: Total number of translation imports available
        _links:
          type: object
          description: Navigation links for pagination
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            next:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            prev:
              type: object
              properties:
                href:
                  type: string
                  format: uri
    TranslationImport:
      type: object
      description: A translation import object for importing translations
      properties:
        id:
          type: string
          description: Translation import identifier
          readOnly: true
        name:
          type: string
          description: Name of the translation import
          maxLength: 10240
        description:
          type: string
          description: Description of the translation import
          maxLength: 10240
        status:
          type: string
          description: Status of the translation import
          enum:
            - pending
            - running
            - completed
            - failed
          readOnly: true
        file_name:
          type: string
          description: Name of the imported file
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
        _links:
          type: object
          description: Related links for the translation import
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  format: uri
    TranslationChange:
      type: object
      description: A translation change representing a modification to translation content
      required:
        - id
        - change_type
        - source_text
        - target_text
        - locale
      properties:
        id:
          type: string
          description: Unique identifier for the translation change
          readOnly: true
        change_type:
          type: string
          description: Type of change made to the translation
          enum:
            - added
            - modified
            - removed
          readOnly: true
        source_text:
          type: string
          description: Original source text for translation
          readOnly: true
        target_text:
          type: string
          description: Translated target text
          readOnly: true
        locale:
          type: string
          description: Language locale for the translation change
          readOnly: true
        category:
          type: string
          description: Translation category
          readOnly: true
        status:
          type: string
          description: Status of the translation change
          enum:
            - pending
            - approved
            - rejected
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          readOnly: true
        _links:
          type: object
