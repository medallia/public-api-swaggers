openapi: 3.0.0
info:
  title: Translations API
  version: 1.0.0
  description:
    The Medallia Translations API enables exporting and importing
    translations within Medallia Experience Cloud for localization
    and internationalization support.
  termsOfService: https://medallia.com/about/legal/terms/api
servers:
  - url: 'https://{api-gateway-hostname}'
    variables:
      api-gateway-hostname:
        default: instance-tenant.apis.medallia.com
        description:
          The Medallia Experience Cloud hostname used to access
          Medallia Reporting
paths:
